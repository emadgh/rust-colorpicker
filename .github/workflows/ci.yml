name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Build Windows picker demo
        if: runner.os == 'Windows'
        run: cargo build --release --example picker

      - name: Upload Windows picker demo
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rust-colorpicker-demo-windows
          path: target/release/examples/picker.exe
          if-no-files-found: error
          retention-days: 14
