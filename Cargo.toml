[package]
name = "rust-colorpicker"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Framework-independent custom native color picker primitives and Win32 controls for Rust applications"
license = "MIT"
repository = "https://github.com/emadgh/rust-colorpicker"
readme = "README.md"
keywords = ["color-picker", "win32", "native", "windows"]
categories = ["gui"]

[lib]
name = "rust_colorpicker"
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = ">=0.61, <0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
